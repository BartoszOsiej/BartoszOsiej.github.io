<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Spotify callback — Bartosz Osiej</title>
<style>
  :root{--void:#050505;--rust:#F15A24;--blood:#E04855;--bone:#E8E6E3;--slate:#8B93A3;--line:#22222a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:var(--bone);font-family:"Space Mono","JetBrains Mono",ui-monospace,monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{max-width:640px;width:100%;border:1px solid var(--line);box-shadow:6px 6px 0 var(--line);padding:32px}
  .kicker{color:var(--rust);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
  h1{font-size:20px;font-weight:700;margin-bottom:16px}
  p{font-size:13px;line-height:1.6;color:var(--slate);margin-bottom:14px}
  .code{display:flex;gap:8px;margin:18px 0}
  input{flex:1;background:#0a0a0a;border:1px solid var(--line);color:var(--rust);font-family:inherit;font-size:12px;padding:12px;overflow:hidden;text-overflow:ellipsis}
  button{background:var(--rust);color:var(--void);border:none;font-family:inherit;font-weight:700;font-size:12px;padding:12px 18px;cursor:pointer}
  button:hover{background:#ff6a35}
  .ok{color:#22c55e}
  .err{color:var(--blood)}
  a{color:var(--rust)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <p class="kicker">// SPOTIFY_OAUTH_CALLBACK</p>
  <h1 id="title">Checking…</h1>
  <p id="msg"></p>
  <div class="code hidden" id="codebox">
    <input id="code" readonly>
    <button onclick="navigator.clipboard.writeText(document.getElementById('code').value).then(()=>{document.getElementById('title').textContent='COPIED ✓'})">COPY</button>
  </div>
  <p class="hidden" id="next">
    → Copy the code above and paste it into the chat / terminal where you started authorization.
    <br><br><a href="/">← back to bartoszosiej.github.io</a>
  </p>
</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var code = qs.get("code");
  var error = qs.get("error");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  if (code) {
    title.textContent = "AUTH CODE CAPTURED ✓";
    msg.innerHTML = '<span class="ok">Spotify approved the request.</span> Copy the code below and send it back — it will be exchanged for a long-lived refresh token.';
    document.getElementById("code").value = code;
    document.getElementById("codebox").classList.remove("hidden");
    document.getElementById("next").classList.remove("hidden");
  } else if (error) {
    title.textContent = "AUTHORIZATION DENIED ✗";
    msg.innerHTML = '<span class="err">Spotify returned: ' + error + '</span><br>Go back and click "Agree", or restart the authorization.';
  } else {
    title.textContent = "NOTHING TO SEE HERE";
    msg.textContent = "This page only makes sense as a Spotify OAuth redirect target. If you landed here by accident — nothing happened, go back.";
  }
})();
</script>
</body>
</html>
