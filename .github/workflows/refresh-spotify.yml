# Refresh Spotify Now Playing — bartoszosiej.github.io
#
# Runs every 5 minutes: refreshes the Spotify access token (PKCE flow —
# NO client secret needed), reads the currently-playing track and commits
# it to now-playing.json (served at https://bartoszosiej.github.io/now-playing.json).
#
# Free-account fallback: /me/player/currently-playing requires Spotify Premium.
# When it is unavailable, the workflow fetches the user's TOP TRACKS instead
# and publishes them as mode:"top_tracks" — the widget shows "ON ROTATION".
#
# Secrets required (PKCE, only two):
#   SPOTIFY_CLIENT_ID      — from the Spotify app dashboard
#   SPOTIFY_REFRESH_TOKEN  — obtained once via PKCE authorization
#
name: Refresh Spotify Now Playing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Spotify data
        id: track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_REFRESH_TOKEN" ]; then
            echo "::notice::Spotify secrets not configured yet — skipping quietly"
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse, urllib.error
          from datetime import datetime, timezone

          cid = os.environ["SPOTIFY_CLIENT_ID"]
          refresh = os.environ["SPOTIFY_REFRESH_TOKEN"]

          def post(url, data):
              req = urllib.request.Request(url, data=urllib.parse.urlencode(data).encode(),
                                           headers={"Content-Type": "application/x-www-form-urlencoded"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def get(url, token):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, ""

          now = datetime.now(timezone.utc).isoformat()
          out = {"playing": False, "fetched_at": now}

          try:
              tok = post("https://accounts.spotify.com/api/token", {
                  "grant_type": "refresh_token",
                  "refresh_token": refresh,
                  "client_id": cid,
              })
              access = tok["access_token"]
              rotated = tok.get("refresh_token")
              if rotated:
                  with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                      f.write(f"new_refresh={rotated}\n")

              # 1) try currently-playing (Premium-only endpoint)
              code, body = get("https://api.spotify.com/v1/me/player/currently-playing", access)
              if code == 200 and body:
                  d = json.loads(body)
                  if d.get("is_playing") and d.get("item"):
                      item = d["item"]
                      out = {
                          "playing": True,
                          "title": item.get("name"),
                          "artist": ", ".join(a.get("name", "") for a in item.get("artists", [])),
                          "album": item.get("album", {}).get("name"),
                          "artwork": (item.get("album", {}).get("images") or [{}])[-1].get("url"),
                          "url": item.get("external_urls", {}).get("spotify"),
                          "fetched_at": now,
                      }

              # 2) free-account fallback: top tracks → ON ROTATION
              if not out.get("playing"):
                  code, body = get("https://api.spotify.com/v1/me/top/tracks?time_range=short_term&limit=5", access)
                  if code == 200 and body:
                      tracks = []
                      for t in json.loads(body).get("items", []):
                          tracks.append({
                              "title": t.get("name"),
                              "artist": ", ".join(a.get("name", "") for a in t.get("artists", [])),
                              "artwork": (t.get("album", {}).get("images") or [{}])[-1].get("url"),
                              "url": t.get("external_urls", {}).get("spotify"),
                          })
                      if tracks:
                          out = {"mode": "top_tracks", "tracks": tracks, "fetched_at": now}
          except Exception as e:
              out = {"playing": False, "error": str(e)[:200], "fetched_at": now}

          with open("now-playing.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Rotate refresh token (if Spotify sent a new one)
        if: steps.track.outputs.new_refresh != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_REFRESH: ${{ steps.track.outputs.new_refresh }}
        run: gh secret set SPOTIFY_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" -b "$NEW_REFRESH"

      - name: Commit now-playing.json
        run: |
          git config user.name  "spotify-bot"
          git config user.email "thethreadcalls@outlook.com"
          git add now-playing.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -q -m "chore: spotify now-playing update"
            git push
          fi
