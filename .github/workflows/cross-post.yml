name: Cross-post (crier)

# Content syndication / cross-posting.
# Push to main touching content/*.md -> crier publishes to every configured
# platform (batch, API-only). Registry (SQLite) is cached + committed back
# so posts are never duplicated. Mirror status exported to blog/mirror.json
# for the frontend to render real LIVE/PENDING/NOT_CONFIGURED per platform.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
      - ".github/workflows/cross-post.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC — weekly catch-up audit

permissions:
  contents: write

concurrency:
  group: cross-post
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    env:
      CRIER_HOME: ${{ github.workspace }}/.crier-home
      CRIER_DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      CRIER_HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
      CRIER_BLUESKY_API_KEY: ${{ secrets.BLUESKY_API_KEY }}
      CRIER_MASTODON_API_KEY: ${{ secrets.MASTODON_API_KEY }}
      CRIER_LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
      CRIER_THREADS_API_KEY: ${{ secrets.THREADS_API_KEY }}
      CRIER_TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
      CRIER_DISCORD_API_KEY: ${{ secrets.DISCORD_WEBHOOK_URL }}
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore crier registry (idempotency across runs)
        uses: actions/cache@v4
        with:
          path: .crier-home/.config/crier
          key: crier-registry-${{ github.run_id }}
          restore-keys: crier-registry-

      - name: Install crier
        run: pip install crier

      - name: Configure crier (CLI — not manual YAML)
        run: |
          # crier reads ~/.config/crier/config.yaml — override HOME so it
          # lands in the cached .crier-home directory.
          mkdir -p "$CRIER_HOME/.config/crier"
          export HOME="$CRIER_HOME"

          crier config content set "$GITHUB_WORKSPACE/content"
          crier config set site_base_url "https://bartoszosiej.github.io"
          crier config set exclude_patterns "_drafts/*"

          # --- platform keys (env -> crier config, skip empty) ---
          if [ -n "$CRIER_MASTODON_API_KEY" ]; then
            # crier mastodon api_key format: "instance:token" OR just "token" (defaults to mastodon.social)
            crier config set mastodon.api_key "$CRIER_MASTODON_API_KEY"
          fi
          if [ -n "$CRIER_DEVTO_API_KEY" ]; then
            crier config set devto.api_key "$CRIER_DEVTO_API_KEY"
          fi
          if [ -n "$CRIER_HASHNODE_API_KEY" ]; then
            crier config set hashnode.api_key "$CRIER_HASHNODE_API_KEY"
          fi
          if [ -n "$CRIER_BLUESKY_API_KEY" ]; then
            crier config set bluesky.api_key "$CRIER_BLUESKY_API_KEY"
          fi
          if [ -n "$CRIER_LINKEDIN_API_KEY" ]; then
            crier config set linkedin.api_key "$CRIER_LINKEDIN_API_KEY"
          fi
          if [ -n "$CRIER_THREADS_API_KEY" ]; then
            crier config set threads.api_key "$CRIER_THREADS_API_KEY"
          fi
          if [ -n "$CRIER_TELEGRAM_API_KEY" ]; then
            crier config set telegram.api_key "$CRIER_TELEGRAM_API_KEY"
          fi
          if [ -n "$CRIER_DISCORD_API_KEY" ]; then
            crier config set discord.api_key "$CRIER_DISCORD_API_KEY"
          fi

          echo "=== crier config ==="
          crier config show

      - name: Guard — at least one platform configured
        id: guard
        run: |
          export HOME="$CRIER_HOME"
          crier platforms 2>/dev/null | grep -c "Configured" > /tmp/cfg_count.txt || true
          COUNT=$(cat /tmp/cfg_count.txt)
          echo "platforms configured: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Cross-post skipped: no platform API keys configured." >> "$GITHUB_STEP_SUMMARY"
            echo "Set MASTODON_API_KEY / DEVTO_API_KEY / HASHNODE_API_KEY / BLUESKY_API_KEY in repo Settings → Secrets → Actions, then re-run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (batch, API platforms only)
        if: steps.guard.outputs.skip != 'true'
        run: |
          export HOME="$CRIER_HOME"
          set +e
          crier audit --publish --batch --only-api --json > crier-results.json
          CODE=$?
          echo "crier exit code: $CODE (0=ok, 2=partial — expected while some platforms are unconfigured)"
          if [ "$CODE" -ge 3 ]; then exit "$CODE"; fi

      - name: Job summary (JSON-tolerant)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = "crier-results.json"
          if not os.path.exists(path):
              print("no results file"); raise SystemExit(0)
          raw = open(path).read().strip()
          if not raw.startswith("{"):
              print("crier output (non-JSON):", raw[:300])
              raise SystemExit(0)
          data = json.loads(raw)
          lines = ["## Cross-post results", ""]
          for r in data.get("results", []):
              mark = "✅" if r.get("success") else "❌"
              lines.append(f"- {mark} {r.get('platform')}: {r.get('url', r.get('error', 'failed'))}")
          s = data.get("summary", {})
          lines.append("")
          lines.append(f"Succeeded: {s.get('succeeded', '?')} · Failed: {s.get('failed', '?')} · Skipped: {s.get('skipped', '?')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Export mirror.json (real status from crier DB + live dev.to API)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, glob, sqlite3, datetime, urllib.request

          DB = os.path.join(os.environ.get("CRIER_HOME", ""), ".config", "crier", "crier.db")
          mirror_path = "blog/mirror.json"

          # --- discover content slugs ---
          post_slugs = []
          for f in sorted(glob.glob("content/*.md")):
              slug = os.path.splitext(os.path.basename(f))[0]
              if slug.startswith("_") or slug == "bip-calendar":
                  continue
              post_slugs.append(slug)

          hrs = ["devto", "hashnode", "bluesky", "mastodon", "linkedin", "threads", "telegram", "discord"]
          results = {}

          # --- crier SQLite registry (source of truth for every publish) ---
          if os.path.exists(DB):
              conn = sqlite3.connect(DB)
              rows = conn.execute(
                  "SELECT a.canonical_url, p.platform, p.url, p.published_at, p.last_error "
                  "FROM publications p JOIN articles a ON a.slug = p.slug "
                  "WHERE p.deleted_at IS NULL"
              ).fetchall()
              conn.close()
              for canonical_url, platform, url, published_at, last_error in rows:
                  slug = canonical_url.rsplit("/content/", 1)[-1].rstrip("/") if canonical_url and "/content/" in canonical_url else None
                  if not slug:
                      continue
                  results.setdefault(slug, {})[platform] = url or ({"error": last_error} if last_error else None)

          # --- live dev.to check: cache may restore a stale crier.db, API never lies ---
          devto_key = os.environ.get("CRIER_DEVTO_API_KEY", "")
          if devto_key:
              try:
                  req = urllib.request.Request(
                      "https://dev.to/api/articles/me?per_page=30",
                      headers={"api-key": devto_key,
                               "user-agent": "Mozilla/5.0 (X11; Linux x86_64) crier-bz/1.0",
                               "accept": "application/json"},
                  )
                  arts = json.loads(urllib.request.urlopen(req, timeout=20).read())
                  for a in arts:
                      can = a.get("canonical_url", "")
                      if "/content/" not in can:
                          continue
                      sl = can.rsplit("/content/", 1)[-1].rstrip("/")
                      if sl in post_slugs:
                          results.setdefault(sl, {})["devto"] = a.get("url", "")
              except Exception as e:
                  print("dev.to API check failed:", e)

          # --- build mirror.json ---
          mirror = {"updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "posts": {}}
          for slug in sorted(set(post_slugs)):
              entry = dict(results.get(slug, {}))
              for p in hrs:
                  if p not in entry:
                      entry[p] = None       # NOT_CONFIGURED — honest, not PENDING
              mirror["posts"][slug] = entry

          with open(mirror_path, "w") as f:
              json.dump(mirror, f, indent=2)
          live = sum(1 for p in mirror["posts"].values() for v in p.values() if v and isinstance(v, str) and v.startswith("http"))
          print(f"mirror.json: {len(mirror['posts'])} posts, {live} live mirror links")
          PY

      - name: Upload results
        if: always() && hashFiles('crier-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crier-results
          path: crier-results.json

      - name: Commit mirror.json back
        if: always()
        run: |
          # Save our exported mirror.json, sync to latest main, then commit
          cp blog/mirror.json /tmp/mirror-export.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/mirror-export.json blog/mirror.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/mirror.json
          git diff --cached --quiet || git commit -m "ci(cross-post): update mirror.json [skip ci]"
          git push
