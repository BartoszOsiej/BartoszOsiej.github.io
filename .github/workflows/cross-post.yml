name: Cross-post (crier)

# Content syndication / cross-posting.
# Push to main touching content/*.md -> crier publishes to every configured
# platform (batch, API-only). Registry (SQLite) is cached + committed back
# so posts are never duplicated. Mirror status exported to blog/mirror.json
# for the frontend to render real LIVE/PENDING/NOT_CONFIGURED per platform.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
      - ".github/workflows/cross-post.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC — weekly catch-up audit

permissions:
  contents: write

concurrency:
  group: cross-post
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    env:
      CRIER_HOME: ${{ github.workspace }}/.crier-home
      CRIER_DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      CRIER_HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
      CRIER_BLUESKY_API_KEY: ${{ secrets.BLUESKY_API_KEY }}
      CRIER_MASTODON_API_KEY: ${{ secrets.MASTODON_API_KEY }}
      CRIER_LINKEDIN_API_KEY: ${{ secrets.LINKEDIN_API_KEY }}
      CRIER_THREADS_API_KEY: ${{ secrets.THREADS_API_KEY }}
      CRIER_TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
      CRIER_DISCORD_API_KEY: ${{ secrets.DISCORD_WEBHOOK_URL }}
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore crier registry (idempotency across runs)
        uses: actions/cache@v4
        with:
          path: .crier-home/.config/crier
          key: crier-registry-${{ github.run_id }}
          restore-keys: crier-registry-

      - name: Install crier
        run: pip install crier

      - name: Configure crier (CLI — not manual YAML)
        run: |
          # crier reads ~/.config/crier/config.yaml — override HOME so it
          # lands in the cached .crier-home directory.
          mkdir -p "$CRIER_HOME/.config/crier"
          export HOME="$CRIER_HOME"

          crier config content set "$GITHUB_WORKSPACE/content"
          crier config set site_base_url "https://bartoszosiej.github.io"
          # exclude_patterns via CLI stores a raw string ("a,b") which crier then
          # iterates CHARACTER BY CHARACTER — the filter silently matches nothing.
          # crier also scans content/ RECURSIVELY, so private subdirs (writing-samples)
          # would end up in audit. Set it through the API as a real list + extra guard.
          python3 - <<'PY'
          import os
          os.environ["HOME"] = os.environ["CRIER_HOME"]
          from crier.config import set_exclude_patterns
          set_exclude_patterns(["_drafts/*", "_index.md", "index.md", "sample-*"])
          print("exclude_patterns set:", ["_drafts/*", "_index.md", "index.md", "sample-*"])
          PY

          # --- platform keys (env -> crier config, skip empty) ---
          if [ -n "$CRIER_MASTODON_API_KEY" ]; then
            # crier mastodon api_key format: "instance:token" OR just "token" (defaults to mastodon.social)
            crier config set mastodon.api_key "$CRIER_MASTODON_API_KEY"
          fi
          if [ -n "$CRIER_DEVTO_API_KEY" ]; then
            crier config set devto.api_key "$CRIER_DEVTO_API_KEY"
          fi
          if [ -n "$CRIER_HASHNODE_API_KEY" ]; then
            crier config set hashnode.api_key "$CRIER_HASHNODE_API_KEY"
          fi
          if [ -n "$CRIER_BLUESKY_API_KEY" ]; then
            crier config set bluesky.api_key "$CRIER_BLUESKY_API_KEY"
          fi
          if [ -n "$CRIER_LINKEDIN_API_KEY" ]; then
            crier config set linkedin.api_key "$CRIER_LINKEDIN_API_KEY"
          fi
          if [ -n "$CRIER_THREADS_API_KEY" ]; then
            crier config set threads.api_key "$CRIER_THREADS_API_KEY"
          fi
          if [ -n "$CRIER_TELEGRAM_API_KEY" ]; then
            crier config set telegram.api_key "$CRIER_TELEGRAM_API_KEY"
          fi
          if [ -n "$CRIER_DISCORD_API_KEY" ]; then
            crier config set discord.api_key "$CRIER_DISCORD_API_KEY"
          fi

          echo "=== crier config ==="
          crier config show

      - name: Guard — at least one platform configured
        id: guard
        run: |
          export HOME="$CRIER_HOME"
          crier platforms 2>/dev/null | grep -c "Configured" > /tmp/cfg_count.txt || true
          COUNT=$(cat /tmp/cfg_count.txt)
          echo "platforms configured: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Cross-post skipped: no platform API keys configured." >> "$GITHUB_STEP_SUMMARY"
            echo "Set MASTODON_API_KEY / DEVTO_API_KEY / HASHNODE_API_KEY / BLUESKY_API_KEY in repo Settings → Secrets → Actions, then re-run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-seed dev.to registry (idempotency vs stale cache)
        if: steps.guard.outputs.skip != 'true'
        run: |
          export HOME="$CRIER_HOME"
          python3 - <<'PY'
          import os, json, glob, pathlib, urllib.request

          # crier registry lives under $HOME/.config/crier/crier.db
          os.environ["HOME"] = os.environ["CRIER_HOME"]
          from crier.registry import record_publication

          api_key = os.environ.get("CRIER_DEVTO_API_KEY", "")
          if not api_key:
              print("no DEVTO_API_KEY — nothing to pre-seed")
              raise SystemExit(0)

          post_slugs = [
              pathlib.Path(f).stem for f in sorted(glob.glob("content/*.md"))
              if not pathlib.Path(f).stem.startswith("_")
                 and pathlib.Path(f).stem != "bip-calendar"
          ]

          req = urllib.request.Request(
              "https://dev.to/api/articles/me?per_page=30",
              headers={
                  "api-key": api_key,
                  "user-agent": "Mozilla/5.0 (X11; Linux x86_64) crier-bz/1.0",
                  "accept": "application/json",
              },
          )
          try:
              arts = json.loads(urllib.request.urlopen(req, timeout=20).read())
          except Exception as e:
              print("dev.to API error:", e)
              raise SystemExit(0)

          seeded = 0
          for a in arts:
              can = a.get("canonical_url", "")
              if "/content/" not in can:
                  continue
              slug = can.rsplit("/content/", 1)[-1].rstrip("/")
              if slug not in post_slugs:
                  continue
              # UPSERT the publication row so crier's is_published() is True
              record_publication(
                  can, "devto", str(a.get("id", "")), a.get("url", ""),
                  title=a.get("title", ""),
                  source_file=f"content/{slug}.md",
              )
              seeded += 1
          print(f"pre-seeded {seeded} dev.to publications into registry")
          PY

      - name: Publish (dedup devto/mastodon + bluesky per-article short text)
        if: steps.guard.outputs.skip != 'true'
        run: |
          export HOME="$CRIER_HOME"
          python3 - <<'PY'
          import os, json, glob, pathlib, subprocess

          # Must happen BEFORE crier.registry is imported so the SQLite registry
          # is opened under the CRIER_HOME config dir.
          os.environ["HOME"] = os.environ["CRIER_HOME"]
          import crier.registry as reg

          def post_slugs():
              return [
                  pathlib.Path(f).stem for f in sorted(glob.glob("content/*.md"))
                  if not pathlib.Path(f).stem.startswith("_")
                     and pathlib.Path(f).stem != "bip-calendar"
              ]

          slugs = post_slugs()
          canon = {s: f"https://bartoszosiej.github.io/content/{s}" for s in slugs}

          # platform targets = configured keys on this run (default core trio)
          targets = ["devto", "mastodon"]
          if os.environ.get("CRIER_THREADS_API_KEY"):
              targets.append("threads")
          if os.environ.get("CRIER_TELEGRAM_API_KEY"):
              targets.append("telegram")
          if os.environ.get("CRIER_DISCORD_API_KEY"):
              targets.append("discord")
          if os.environ.get("CRIER_LINKEDIN_API_KEY"):
              targets.append("linkedin")
          # bluesky handled separately below (per-article short text)

          # 1) batch: all API platforms except bluesky (dedup via registry)
          # crier audit --to is a multi-value click option: each platform needs
          # its own "--to <name>" flag (a single "--to devto mastodon discord"
          # makes click treat "mastodon" as the positional PATH and exits rc=2).
          to_args = [flag for p in targets for flag in ("--to", p)]
          batch = subprocess.run(
              ["crier", "audit", "--publish", "--batch", *to_args],
              capture_output=True, text=True, timeout=600,
          )
          if batch.returncode not in (0, 2):
              print("batch audit rc=", batch.returncode)
              print(batch.stdout[-1200:])
              print(batch.stderr[-1200:])

          # 2) bluesky — one short post per article (per-article rewrite text)
          for slug in slugs:
              if reg.is_published(canon[slug], "bluesky"):
                  continue
              rewrite_file = f"bluesky/{slug}.txt"
              if not os.path.exists(rewrite_file):
                  print(f"[bluesky] no rewrite text for {slug} — skipped")
                  continue
              proc = subprocess.run(
                  ["crier", "publish", f"content/{slug}.md", "--to", "bluesky",
                   "--rewrite-file", rewrite_file, "--yes", "--json"],
                  capture_output=True, text=True, timeout=300,
              )
              print(f"[bluesky] {slug}: rc={proc.returncode}")
              if proc.returncode != 0:
                  print(proc.stdout[-500:])
                  print(proc.stderr[-500:])

          # 3) report results straight from the registry (source of truth)
          results = []
          for slug in slugs:
              for plat in targets + ["bluesky"]:
                  info = reg.get_publication_info(canon[slug], plat)
                  if info and info.get("article_id"):
                      results.append({"file": f"content/{slug}.md", "platform": plat,
                                      "success": True, "url": info.get("url") or ""})
                  else:
                      results.append({"file": f"content/{slug}.md", "platform": plat,
                                      "success": False, "url": None,
                                      "error": "not published in this run"})
          ok = sum(1 for r in results if r["success"])
          with open("crier-results.json", "w") as fh:
              json.dump({"results": results,
                         "summary": {"succeeded": ok, "failed": len(results) - ok,
                                     "skipped": 0}}, fh, indent=2)
          PY

      - name: Job summary (JSON-tolerant)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = "crier-results.json"
          if not os.path.exists(path):
              print("no results file"); raise SystemExit(0)
          raw = open(path).read().strip()
          if not raw.startswith("{"):
              print("crier output (non-JSON):", raw[:300])
              raise SystemExit(0)
          data = json.loads(raw)
          lines = ["## Cross-post results", ""]
          for r in data.get("results", []):
              mark = "✅" if r.get("success") else "❌"
              lines.append(f"- {mark} {r.get('platform')}: {r.get('url', r.get('error', 'failed'))}")
          s = data.get("summary", {})
          lines.append("")
          lines.append(f"Succeeded: {s.get('succeeded', '?')} · Failed: {s.get('failed', '?')} · Skipped: {s.get('skipped', '?')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Export mirror.json (real status from crier DB + live dev.to API)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, glob, sqlite3, datetime, urllib.request

          DB = os.path.join(os.environ.get("CRIER_HOME", ""), ".config", "crier", "crier.db")
          mirror_path = "blog/mirror.json"

          # --- discover content slugs ---
          post_slugs = []
          for f in sorted(glob.glob("content/*.md")):
              slug = os.path.splitext(os.path.basename(f))[0]
              if slug.startswith("_") or slug == "bip-calendar":
                  continue
              post_slugs.append(slug)

          hrs = ["devto", "hashnode", "bluesky", "mastodon", "linkedin", "threads", "telegram", "discord"]
          results = {}

          # --- crier SQLite registry (source of truth for every publish) ---
          if os.path.exists(DB):
              conn = sqlite3.connect(DB)
              rows = conn.execute(
                  "SELECT a.canonical_url, p.platform, p.url, p.platform_id, p.published_at, p.last_error "
                  "FROM publications p JOIN articles a ON a.slug = p.slug "
                  "WHERE p.deleted_at IS NULL"
              ).fetchall()
              conn.close()
              for canonical_url, platform, url, platform_id, published_at, last_error in rows:
                  slug = canonical_url.rsplit("/content/", 1)[-1].rstrip("/") if canonical_url and "/content/" in canonical_url else None
                  if not slug:
                      continue
                  # webhook platforms (discord) return no URL — stash the message
                  # id in the value so the discord link resolver below can use it
                  if url:
                      results.setdefault(slug, {}).setdefault(platform, url)
                  elif platform_id and platform in ("discord", "telegram"):
                      results.setdefault(slug, {}).setdefault(platform, platform_id)
                  elif last_error:
                      results.setdefault(slug, {}).setdefault(platform, {"error": last_error})

          # --- discord: webhooks return only a message id — resolve the
          # canonical message link from the webhook channel_id ---
          disc_key = os.environ.get("CRIER_DISCORD_API_KEY", "")
          disc_channel = None
          if disc_key:
              try:
                  req = urllib.request.Request(
                      "https://discord.com/api/webhooks/" + disc_key.split("/api/webhooks/")[-1],
                      headers={"user-agent": "crier-bz/1.0"},
                  )
                  w = json.loads(urllib.request.urlopen(req, timeout=20).read())
                  disc_channel = w.get("channel_id")
              except Exception as e:
                  print("discord webhook lookup failed:", e)
          if disc_channel:
              for entry in results.values():
                  mid = entry.get("discord")
                  if isinstance(mid, str) and mid.isdigit():
                      entry["discord"] = (f"https://discord.com/channels/"
                                          f"{disc_channel}/{disc_channel}/{mid}")

          # --- live dev.to check: cache may restore a stale crier.db, API never lies ---
          devto_key = os.environ.get("CRIER_DEVTO_API_KEY", "")
          if devto_key:
              try:
                  req = urllib.request.Request(
                      "https://dev.to/api/articles/me?per_page=30",
                      headers={"api-key": devto_key,
                               "user-agent": "Mozilla/5.0 (X11; Linux x86_64) crier-bz/1.0",
                               "accept": "application/json"},
                  )
                  arts = json.loads(urllib.request.urlopen(req, timeout=20).read())
                  for a in arts:
                      can = a.get("canonical_url", "")
                      if "/content/" not in can:
                          continue
                      sl = can.rsplit("/content/", 1)[-1].rstrip("/")
                      if sl in post_slugs:
                          results.setdefault(sl, {})["devto"] = a.get("url", "")
              except Exception as e:
                  print("dev.to API check failed:", e)

          # --- build mirror.json ---
          mirror = {"updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "posts": {}}
          for slug in sorted(set(post_slugs)):
              entry = dict(results.get(slug, {}))
              for p in hrs:
                  if p not in entry:
                      entry[p] = None       # NOT_CONFIGURED — honest, not PENDING
              mirror["posts"][slug] = entry

          with open(mirror_path, "w") as f:
              json.dump(mirror, f, indent=2)
          live = sum(1 for p in mirror["posts"].values() for v in p.values() if v and isinstance(v, str) and v.startswith("http"))
          print(f"mirror.json: {len(mirror['posts'])} posts, {live} live mirror links")
          PY

      - name: Upload results
        if: always() && hashFiles('crier-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crier-results
          path: crier-results.json

      - name: Commit mirror.json back
        if: always()
        run: |
          # Save our exported mirror.json, sync to latest main, then commit
          cp blog/mirror.json /tmp/mirror-export.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/mirror-export.json blog/mirror.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/mirror.json
          git diff --cached --quiet || git commit -m "ci(cross-post): update mirror.json [skip ci]"
          git push
